<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Каталог подарков</title>
<style>
:root{--bg:#fff;--fg:#111;--hint:#7b8794;--card:#f2f4f7;--btn:#2b8cff;--btnt:#fff;--line:#e3e7ec}
@media (prefers-color-scheme:dark){:root{--bg:#17212b;--fg:#f1f4f8;--hint:#8a97a6;--card:#222f3d;--btn:#4aa3ff;--btnt:#fff;--line:#2d3b4b}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.35 -apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 12px 6px;border-bottom:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:baseline}
h1{font-size:18px;margin:0}
.meta{font-size:11px;color:var(--hint)}
input[type=search]{width:100%;margin:8px 0 6px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:15px;outline:none}
.row{display:flex;gap:8px;align-items:center}
select{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:13px}
.sq{flex:none;padding:8px 11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:13px;cursor:pointer}.sq.off{opacity:.55}
.lt{position:absolute;inset:0;opacity:0;transition:opacity .45s}.lt.ok{opacity:1}.lt svg{width:100%;height:100%;display:block}
.ph img.bgb{filter:blur(26px) saturate(1.2);transform:scale(1.5);transition:opacity .35s,filter .5s}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;padding:5px 11px 5px 6px;border-radius:18px;transition:background .2s,transform .15s;background:var(--card);font-size:13px;white-space:nowrap;cursor:pointer;border:1px solid transparent}
.chip:active{transform:scale(.95)}.chip.txt{padding:6px 12px}.av{width:24px;height:24px;border-radius:50%;background:var(--line);object-fit:cover;flex:none;font-size:14px;display:flex;align-items:center;justify-content:center;overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}.cc{background:var(--card);border-radius:12px;overflow:hidden;text-align:center;cursor:pointer;animation:pop .35s ease both;transition:transform .15s}.cc:active{transform:scale(.95)}.cc .ph{animation:sh 1.4s linear infinite}.cc .nm{padding:6px 6px 0;font-size:12px;white-space:normal;line-height:1.2;height:30px;overflow:hidden}.cc .sub{padding:0 6px 8px}.cc.on{outline:2px solid var(--btn)}
.chip.on{background:var(--btn);color:var(--btnt)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 12px}
.card{background:var(--card);border-radius:14px;overflow:hidden;cursor:pointer;animation:pop .38s ease both;transition:transform .15s}.card:active{transform:scale(.96)}
.ph{aspect-ratio:1;background:linear-gradient(110deg,var(--line) 30%,var(--card) 50%,var(--line) 70%);background-size:200% 100%;animation:sh 1.4s linear infinite;display:flex;align-items:center;justify-content:center;font-size:44px;position:relative}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s}.ph img.ok{opacity:1}
@keyframes sh{to{background-position:-200% 0}}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
.ci{padding:8px 10px 10px}
.nm{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:11px;color:var(--hint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr{margin-top:4px;font-weight:700;color:var(--btn)}
.state{padding:40px 20px;text-align:center;color:var(--hint)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;opacity:0;pointer-events:none;transition:opacity .25s}.sheet-bg.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;z-index:21;padding:14px 14px calc(14px + env(safe-area-inset-bottom));transform:translateY(105%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility .3s}.sheet.open{transform:none;visibility:visible}
.sheet .big{width:70%;max-width:280px;margin:0 auto 10px;border-radius:14px;overflow:hidden}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv span:first-child{color:var(--hint)}
.btn{display:block;width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;background:var(--btn);color:var(--btnt);font-size:15px;font-weight:600;cursor:pointer}
.btn.sec{background:var(--card);color:var(--fg)}
.list .it{padding:12px 4px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;cursor:pointer}
.note{font-size:11px;color:var(--hint);margin-top:10px;text-align:center}
</style>
</head>
<body>
<header>
  <div class="top"><h1>🎁 Каталог аренды</h1><div class="meta" id="meta"></div></div>
  <input type="search" id="q" placeholder="Поиск: название, номер, модель, фон…" autocomplete="off">
  <div class="row">
    <select id="sort"><option value="p">Сначала дешёвые</option><option value="pd">Сначала дорогие</option><option value="n">По названию</option></select>
    <select id="mx"><option value="0">Любая цена</option><option value="100">до 100 ₽</option><option value="300">до 300 ₽</option><option value="1000">до 1000 ₽</option><option value="3000">до 3000 ₽</option></select>
    <button class="sq" id="animBtn" title="Анимации подарков">✨</button>
  </div>
  <div class="chips" id="chips"></div>
</header>
<div id="grid" class="grid"></div>
<div id="state" class="state">Загрузка каталога…</div>
<div id="sentinel" style="height:1px"></div>
<div class="sheet-bg" id="bg"></div>
<div class="sheet" id="sheet"></div>
<script>
(function(){
var TG=null;try{TG=window.Telegram&&window.Telegram.WebApp}catch(e){}
function $(i){return document.getElementById(i)}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
var DATA=null,ITEMS=[],VIEW=[],SHOWN=0,COLL="",PAGE=40,BOT="";
function applyTheme(){
  try{var p=TG&&TG.themeParams;if(!p)return;var r=document.documentElement.style;
  if(p.bg_color)r.setProperty('--bg',p.bg_color);if(p.text_color)r.setProperty('--fg',p.text_color);
  if(p.hint_color)r.setProperty('--hint',p.hint_color);if(p.secondary_bg_color)r.setProperty('--card',p.secondary_bg_color);
  if(p.button_color)r.setProperty('--btn',p.button_color);if(p.button_text_color)r.setProperty('--btnt',p.button_text_color);}catch(e){}
}
var INITED=false;
function initTG(){try{if(INITED)return;TG=window.Telegram&&window.Telegram.WebApp;if(!TG)return;INITED=true;TG.ready();TG.expand();applyTheme();TG.onEvent&&TG.onEvent('themeChanged',applyTheme);
  if(TG.BackButton)TG.BackButton.onClick(function(){showSheet(false)})}catch(e){}}
window.__sdk=initTG;initTG();
function fmt(n){return Math.round(n).toLocaleString('ru-RU')}
function price(it,d){return Math.ceil(it.p*d+((DATA&&DATA.f)||0))}
function imgUrl(k){return 'https://nft.fragment.com/gift/'+String(k).toLowerCase()+'.medium.jpg'}
function tgUrl(k){return 'https://t.me/nft/'+k}
function openTg(u){try{if(TG&&TG.openTelegramLink)return TG.openTelegramLink(u)}catch(e){}window.open(u,'_blank')}
var ANIM=true,ACTIVE=[],LIBQ=[],LIBSTATE=0,MAXACT=6;
try{var sv=localStorage.getItem('anim');if(sv==='0')ANIM=false}catch(e){}
try{if(navigator.connection&&navigator.connection.saveData)ANIM=false}catch(e){}
function lottieUrl(k){return 'https://nft.fragment.com/gift/'+String(k).toLowerCase()+'.lottie.json'}
function withLib(cb){
  if(window.lottie)return cb();
  LIBQ.push(cb);if(LIBSTATE)return;LIBSTATE=1;
  var sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js';
  sc.onload=function(){LIBSTATE=2;var q=LIBQ;LIBQ=[];q.forEach(function(f){f()})};
  sc.onerror=function(){LIBSTATE=0;LIBQ=[];ANIM=false;syncBtn()};document.head.appendChild(sc);
}
function stopAnim(h){
  if(!h||!h.box)return;
  try{h.a&&h.a.destroy()}catch(e){}
  try{h.box.remove()}catch(e){}
  if(h.img)h.img.classList.remove('bgb');
  h.box=null;var i=ACTIVE.indexOf(h);if(i>=0)ACTIVE.splice(i,1);
}
function startAnim(ph,k,limit){
  if(!ANIM||!k||ph._h)return null;
  var h={box:null,a:null,img:ph.querySelector('img')};ph._h=h;
  withLib(function(){
    if(!ANIM||ph._h!==h||!ph.isConnected)return;
    var box=el('div','lt');h.box=box;ph.appendChild(box);
    try{
      h.a=window.lottie.loadAnimation({container:box,renderer:'svg',loop:true,autoplay:true,path:lottieUrl(k),
        rendererSettings:{preserveAspectRatio:'xMidYMid slice',progressiveLoad:true}});
      h.a.addEventListener('DOMLoaded',function(){box.classList.add('ok');if(h.img)h.img.classList.add('bgb');ph.style.animation='none'});
      h.a.addEventListener('data_failed',function(){stopAnim(h);ph._h=null});
    }catch(e){stopAnim(h);ph._h=null;return}
    if(limit){ACTIVE.push(h);while(ACTIVE.length>MAXACT){var o=ACTIVE[0];ACTIVE.shift();if(o.ph)o.ph._h=null;stopAnim(o)}}
  });
  h.ph=ph;return h;
}
var IO=('IntersectionObserver' in window)?new IntersectionObserver(function(es){
  es.forEach(function(e){var ph=e.target;
    clearTimeout(ph._t);
    if(e.isIntersecting){if(ANIM&&!ph._h)ph._t=setTimeout(function(){if(ANIM&&!ph._h)startAnim(ph,ph.getAttribute('data-k'),true)},300)}
    else if(ph._h){var h=ph._h;ph._h=null;stopAnim(h)}});
},{rootMargin:'0px',threshold:0.45}):null;
function watch(ph,k){if(IO&&k){ph.setAttribute('data-k',k);IO.observe(ph)}}
function syncBtn(){var b=$('animBtn');b.classList[ANIM?'remove':'add']('off');b.textContent=ANIM?'✨':'✨ выкл'}
function setAnim(on){
  ANIM=on;try{localStorage.setItem('anim',on?'1':'0')}catch(e){}
  if(!on){ACTIVE.slice().forEach(function(h){if(h.ph)h.ph._h=null;stopAnim(h)});document.querySelectorAll('.ph').forEach(function(p){if(p._h){stopAnim(p._h);p._h=null}})}
  else{document.querySelectorAll('.ph[data-k]').forEach(function(p){IO&&IO.unobserve(p);IO&&IO.observe(p)})}
  syncBtn();
}
$('animBtn').onclick=function(){setAnim(!ANIM)};syncBtn();
function card(it){
  var c=el('div','card'),ph=el('div','ph','🎁');
  if(it.k){var im=document.createElement('img');im.loading='lazy';im.alt='';im.onload=function(){im.className='ok';ph.style.animation='none';ph.style.background='var(--line)'};im.onerror=function(){im.remove();ph.style.animation='none'};im.src=imgUrl(it.k);ph.appendChild(im)}
  c.appendChild(ph);var ci=el('div','ci');
  ci.appendChild(el('div','nm',it.n));
  ci.appendChild(el('div','sub',[it.m,it.b].filter(Boolean).join(' · ')||it.c));
  ci.appendChild(el('div','pr','от '+fmt(price(it,it.d1))+' ₽'));
  c.appendChild(ci);watch(ph,it.k);c.style.animationDelay=((SHOWN%PAGE)%10*35)+'ms';c.onclick=function(){openSheet(it)};return c;
}
function renderMore(){
  var g=$('grid'),end=Math.min(VIEW.length,SHOWN+PAGE);
  for(var i=SHOWN;i<end;i++)g.appendChild(card(VIEW[i]));
  SHOWN=end;
}
function apply(){
  var q=$('q').value.trim().toLowerCase(),mx=+$('mx').value,s=$('sort').value;
  VIEW=ITEMS.filter(function(it){
    if(COLL&&it.c!==COLL)return false;
    if(mx&&price(it,it.d1)>mx)return false;
    if(q){var h=(it.n+' '+it.c+' '+(it.m||'')+' '+(it.b||'')+' '+(it.s||'')).toLowerCase();
      var ws=q.split(/\s+/);for(var i=0;i<ws.length;i++){if(h.indexOf(ws[i])<0)return false}}
    return true;
  });
  VIEW.sort(function(a,b){return s==='pd'?price(b,b.d1)-price(a,a.d1):s==='n'?a.n.localeCompare(b.n,'ru',{numeric:true}):price(a,a.d1)-price(b,b.d1)});
  $('grid').textContent='';SHOWN=0;renderMore();
  $('state').textContent=VIEW.length?'':'Ничего не найдено 😕';$('state').style.display=VIEW.length?'none':'block';
}
var COVER={},CNT={};
function prep(){CNT={};COVER={};ITEMS.forEach(function(it){CNT[it.c]=(CNT[it.c]||0)+1;var c=COVER[it.c];if(!c||(!c.k&&it.k))COVER[it.c]=it})}
function avatar(n){var a=el('span','av','🎁'),it=COVER[n];
  if(it&&it.k){var im=document.createElement('img');im.alt='';im.loading='lazy';im.onerror=function(){im.remove()};im.src=imgUrl(it.k);a.textContent='';a.appendChild(im)}return a}
function names(){return Object.keys(CNT).sort(function(a,b){return CNT[b]-CNT[a]||a.localeCompare(b,'ru')})}
function chips(){
  var box=$('chips');box.textContent='';
  function mk(label,val,av){var c=el('span','chip'+(av?'':' txt')+(COLL===val?' on':''));if(av)c.appendChild(av);c.appendChild(document.createTextNode(label));c.onclick=function(){COLL=val;chips();apply()};box.appendChild(c)}
  mk('Все ('+ITEMS.length+')','');
  var g=el('span','chip txt','🗂 Коллекции ('+names().length+')');g.onclick=collSheet;box.appendChild(g);
  names().forEach(function(n){mk(n+' ('+CNT[n]+')',n,avatar(n))});
  var on=box.querySelector('.on');if(on&&on.scrollIntoView)try{on.scrollIntoView({inline:'center',block:'nearest'})}catch(e){}
}
var SHEETH=null;
function showSheet(on){if(!on&&SHEETH){stopAnim(SHEETH);SHEETH=null}
  $('bg').classList[on?'add':'remove']('open');$('sheet').classList[on?'add':'remove']('open');
  try{if(TG&&TG.BackButton){on?TG.BackButton.show():TG.BackButton.hide()}}catch(e){}}
$('bg').onclick=function(){showSheet(false)};
function collSheet(){
  var s=$('sheet');s.textContent='';s.appendChild(el('h1',null,'Коллекции в наличии'));
  s.appendChild(el('div','meta','Нажмите на коллекцию, чтобы показать только её'));
  var g=el('div','cgrid'),all=el('div','cc'+(COLL===''?' on':''));
  var ph=el('div','ph','🎁');all.appendChild(ph);all.appendChild(el('div','nm','Все подарки'));all.appendChild(el('div','sub',String(ITEMS.length)));
  all.onclick=function(){COLL='';chips();apply();showSheet(false);window.scrollTo(0,0)};g.appendChild(all);
  names().forEach(function(n,i){var it=COVER[n],c=el('div','cc'+(COLL===n?' on':'')),p=el('div','ph','🎁');
    if(it&&it.k){var im=document.createElement('img');im.alt='';im.loading='lazy';im.onload=function(){im.className='ok';p.style.animation='none';p.style.background='var(--line)'};im.onerror=function(){im.remove();p.style.animation='none'};im.src=imgUrl(it.k);p.appendChild(im)}
    watch(p,it&&it.k);c.appendChild(p);c.appendChild(el('div','nm',n));c.appendChild(el('div','sub',CNT[n]+' шт.'));c.style.animationDelay=Math.min(i,15)*30+'ms';
    c.onclick=function(){COLL=n;chips();apply();showSheet(false);window.scrollTo(0,0)};g.appendChild(c)});
  s.appendChild(g);s.scrollTop=0;showSheet(true);
}
function openSheet(it){
  var s=$('sheet');s.textContent='';
  var big=el('div','big'),ph=el('div','ph','🎁');
  if(it.k){var im=document.createElement('img');im.alt='';im.onload=function(){im.className='ok';ph.style.animation='none';ph.style.background='var(--line)'};im.onerror=function(){im.remove();ph.style.animation='none'};im.src=imgUrl(it.k);ph.appendChild(im)}
  big.appendChild(ph);s.appendChild(big);if(SHEETH){stopAnim(SHEETH);SHEETH=null}
  SHEETH=startAnim(ph,it.k,false);s.appendChild(el('h1',null,it.n));
  function kv(a,b){if(!b)return;var r=el('div','kv');r.appendChild(el('span',null,a));r.appendChild(el('span',null,b));s.appendChild(r)}
  kv('Коллекция',it.c);kv('Модель',it.m);kv('Фон',it.b);kv('Символ',it.s);
  kv('Цена за '+it.d1+' дн.',fmt(price(it,it.d1))+' ₽');
  if(it.d2>it.d1)kv('Срок аренды',it.d1+'–'+it.d2+' дн.');else kv('Срок аренды',it.d1+' дн.');
  var b=el('button','btn','🎁 Арендовать в боте');
  b.onclick=function(){if(BOT)openTg('https://t.me/'+BOT+'?start=g_'+it.a);else alert('Откройте бота и выберите подарок в каталоге')};
  s.appendChild(b);
  if(it.k){var v=el('button','btn sec','👁 Открыть в Telegram');v.onclick=function(){openTg(tgUrl(it.k))};s.appendChild(v)}
  s.appendChild(el('div','note','Цена и наличие окончательно проверяются в боте'));
  showSheet(true);
}
function ago(ts){var m=Math.max(0,Math.round((Date.now()/1000-ts)/60));return m<2?'только что':m<60?m+' мин назад':Math.round(m/60)+' ч назад'}
function load(){
  fetch('catalog.json?ts='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(d){
    DATA=d;ITEMS=d.items||[];BOT=d.bot||'';
    $('meta').textContent=(d.ton?'1 TON ≈ '+fmt(d.ton)+' ₽ · ':'')+'обновлено '+ago(d.ts);
    if(!ITEMS.length){$('state').textContent='Каталог пока пуст';return}
    prep();chips();apply();
  }).catch(function(e){$('state').innerHTML='';var t=el('div',null,'Не удалось загрузить каталог 😕');var b=el('button','btn','Повторить');b.onclick=function(){$('state').textContent='Загрузка каталога…';load()};$('state').appendChild(t);$('state').appendChild(b)});
}
$('q').addEventListener('input',function(){clearTimeout(window._t);window._t=setTimeout(apply,200)});
$('sort').onchange=apply;$('mx').onchange=apply;
if('IntersectionObserver' in window){new IntersectionObserver(function(e){if(e[0].isIntersecting&&SHOWN<VIEW.length)renderMore()},{rootMargin:'600px'}).observe($('sentinel'))}
else window.addEventListener('scroll',function(){if(SHOWN<VIEW.length&&innerHeight+scrollY>document.body.scrollHeight-800)renderMore()});
load();
})();
</script>
<script async src="https://telegram.org/js/telegram-web-app.js" onload="window.__sdk&&window.__sdk()"></script>
</body>
</html>
