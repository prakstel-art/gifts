<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Каталог подарков</title>
<style>
:root{--bg:#f3f5f9;--fg:#0f1722;--hint:#7a8699;--card:#fff;--ph:#e7ebf3;--line:rgba(15,23,34,.09);--a1:#7c5cff;--a2:#2b8cff;--grad:linear-gradient(135deg,var(--a1),var(--a2));--sh:0 8px 24px rgba(40,50,100,.10);--ok:#2fbf71;--r:18px}
@media (prefers-color-scheme:dark){:root{--bg:#0e1621;--fg:#eef2f7;--hint:#8795a8;--card:#17212d;--ph:#223042;--line:rgba(255,255,255,.08);--sh:0 8px 24px rgba(0,0,0,.4)}}
:root.tlight{--bg:#f3f5f9;--fg:#0f1722;--hint:#7a8699;--card:#fff;--ph:#e7ebf3;--line:rgba(15,23,34,.09);--sh:0 8px 24px rgba(40,50,100,.10)}
:root.tdark{--bg:#0e1621;--fg:#eef2f7;--hint:#8795a8;--card:#17212d;--ph:#223042;--line:rgba(255,255,255,.08);--sh:0 8px 24px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 -apple-system,"SF Pro Text",Segoe UI,Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
body:before{content:"";position:fixed;inset:0 0 auto 0;height:260px;background:radial-gradient(60% 100% at 20% 0,rgba(124,92,255,.22),transparent 70%),radial-gradient(50% 100% at 90% 0,rgba(43,140,255,.18),transparent 70%);pointer-events:none;z-index:0}
.gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
button{font:inherit}
header{position:sticky;top:0;z-index:5;padding:12px 14px 8px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.3px;white-space:nowrap}
.meta{font-size:11px;color:var(--hint);text-align:right;line-height:1.25;min-width:0}
input[type=search]{width:100%;margin:10px 0 8px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:15px;outline:none;box-shadow:var(--sh);transition:border-color .2s}
input[type=search]:focus{border-color:var(--a2)}
.row{display:flex;gap:8px;align-items:center}
.pr2{display:flex;gap:8px;align-items:center;margin-top:8px}.pr2 span{color:var(--hint)}.pr2 input,.cq{flex:1;min-width:0;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:14px;outline:none}.pr2 input:focus,.cq:focus{border-color:var(--a2)}.cq{width:100%;flex:none;margin-top:10px;font-size:15px}
select{flex:1;min-width:0;padding:9px 8px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:13px}
.sq{flex:none;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:13px;cursor:pointer}.sq.off{opacity:.55}
.chips{display:flex;gap:7px;overflow-x:auto;padding:9px 0 3px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;padding:5px 12px 5px 6px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:13px;white-space:nowrap;cursor:pointer;transition:transform .15s,background .2s}
.chip:active{transform:scale(.95)}.chip.txt{padding:7px 13px}
.chip.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(80,90,255,.35)}
.av{width:24px;height:24px;border-radius:50%;background:var(--ph);flex:none;font-size:14px;display:flex;align-items:center;justify-content:center;overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}
.grid{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;box-shadow:var(--sh);animation:pop .4s ease both;transition:transform .15s}
.card:active{transform:scale(.96)}
.ph{aspect-ratio:1;background:linear-gradient(110deg,var(--ph) 30%,var(--card) 50%,var(--ph) 70%);background-size:200% 100%;animation:sh 1.4s linear infinite;display:flex;align-items:center;justify-content:center;font-size:44px;position:relative;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s}.ph img.ok{opacity:1}
.ph img.bgb{filter:blur(26px) saturate(1.25);transform:scale(1.5)}
.lt{position:absolute;inset:0;opacity:0;transition:opacity .45s}.lt.ok{opacity:1}.lt svg{width:100%;height:100%;display:block}
@keyframes sh{to{background-position:-200% 0}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.ci{padding:10px 11px 12px}
.nm{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:11px;color:var(--hint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.pr{display:inline-block;margin-top:7px;background:var(--grad);color:#fff;padding:4px 10px;border-radius:10px;font-weight:700;font-size:13px}
.state{position:relative;z-index:1;padding:44px 20px;text-align:center;color:var(--hint)}
.sheet-bg{position:fixed;inset:0;background:rgba(5,10,20,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:20;opacity:0;pointer-events:none;transition:opacity .25s}.sheet-bg.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:90vh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;border-top:1px solid var(--line);z-index:21;padding:8px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility .32s}.sheet.open{transform:none;visibility:visible}
.sheet:before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px;opacity:.9}
.sheet .big{width:72%;max-width:300px;margin:0 auto 14px;border-radius:22px;overflow:hidden;box-shadow:var(--sh);border:1px solid var(--line)}
.sheet h1{margin-bottom:6px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}.kv span:first-child{color:var(--hint)}.kv span:last-child{font-weight:600;text-align:right}
.btn{display:block;width:100%;margin-top:12px;padding:15px;border:0;border-radius:16px;background:var(--grad);color:#fff;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 8px 20px rgba(80,90,255,.35);transition:transform .15s}
.btn:active{transform:scale(.98)}.btn.sec{background:var(--card);color:var(--fg);box-shadow:none;border:1px solid var(--line)}
.list .it{padding:12px 4px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;cursor:pointer}
.note{font-size:11px;color:var(--hint);margin-top:12px;text-align:center}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.cc{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-align:center;cursor:pointer;animation:pop .35s ease both;transition:transform .15s}.cc:active{transform:scale(.95)}
.cc .nm{padding:7px 6px 0;font-size:12px;white-space:normal;line-height:1.2;height:32px;overflow:hidden}.cc .sub{padding:0 6px 9px}
.cc.on{outline:2px solid var(--a2);outline-offset:-2px}
</style>
</head>
<body>
<header>
  <div class="top"><h1><span class="gt">Каталог</span> подарков</h1><div class="meta" id="meta"></div></div>
  <input type="search" id="q" placeholder="Поиск: название, номер, модель, фон…" autocomplete="off">
  <div class="row">
    <select id="sort"><option value="p">Сначала дешёвые</option><option value="pd">Сначала дорогие</option><option value="n">По названию</option></select>
    <button class="sq" id="animBtn" title="Анимации подарков">✨</button>
  </div>
  <div class="pr2"><input type="text" inputmode="numeric" id="pmin" placeholder="Цена от, ₽" autocomplete="off"><span>—</span><input type="text" inputmode="numeric" id="pmax" placeholder="до, ₽" autocomplete="off"></div>
  <div class="chips" id="chips"></div>
</header>
<div id="grid" class="grid"></div>
<div id="state" class="state">Загрузка каталога…</div>
<div id="sentinel" style="height:1px"></div>
<div class="sheet-bg" id="bg"></div>
<div class="sheet" id="sheet"></div>
<script>
(function(){
var TG=null;try{TG=window.Telegram&&window.Telegram.WebApp}catch(e){}
function $(i){return document.getElementById(i)}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
var DATA=null,ITEMS=[],VIEW=[],SHOWN=0,COLL="",PAGE=40,BOT="";
function applyTheme(){
  try{if(!TG)return;var c=document.documentElement.classList;c.remove('tdark','tlight');c.add(TG.colorScheme==='dark'?'tdark':'tlight')}catch(e){}
}
var INITED=false;
function initTG(){try{if(INITED)return;TG=window.Telegram&&window.Telegram.WebApp;if(!TG)return;INITED=true;TG.ready();TG.expand();applyTheme();TG.onEvent&&TG.onEvent('themeChanged',applyTheme);
  if(TG.BackButton)TG.BackButton.onClick(function(){showSheet(false)})}catch(e){}}
window.__sdk=initTG;initTG();
function num(v){v=parseFloat(String(v||'').replace(/\s+/g,'').replace(',','.'));return isFinite(v)&&v>0?v:0}
function fmt(n){return Math.round(n).toLocaleString('ru-RU')}
function price(it,d){return Math.ceil(it.p*d+((DATA&&DATA.f)||0))}
function imgUrl(k){return 'https://nft.fragment.com/gift/'+String(k).toLowerCase()+'.medium.jpg'}
function tgUrl(k){return 'https://t.me/nft/'+k}
function openTg(u){try{if(TG&&TG.openTelegramLink)return TG.openTelegramLink(u)}catch(e){}window.open(u,'_blank')}
var ANIM=true,ACTIVE=[],LIBQ=[],LIBSTATE=0,MAXACT=6;
try{var sv=localStorage.getItem('anim');if(sv==='0')ANIM=false}catch(e){}
try{if(navigator.connection&&navigator.connection.saveData)ANIM=false}catch(e){}
function lottieUrl(k){return 'https://nft.fragment.com/gift/'+String(k).toLowerCase()+'.lottie.json'}
function withLib(cb){
  if(window.lottie)return cb();
  LIBQ.push(cb);if(LIBSTATE)return;LIBSTATE=1;
  var sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js';
  sc.onload=function(){LIBSTATE=2;var q=LIBQ;LIBQ=[];q.forEach(function(f){f()})};
  sc.onerror=function(){LIBSTATE=0;LIBQ=[];ANIM=false;syncBtn()};document.head.appendChild(sc);
}
function stopAnim(h){
  if(!h||!h.box)return;
  try{h.a&&h.a.destroy()}catch(e){}
  try{h.box.remove()}catch(e){}
  if(h.img)h.img.classList.remove('bgb');
  h.box=null;var i=ACTIVE.indexOf(h);if(i>=0)ACTIVE.splice(i,1);
}
function startAnim(ph,k,limit){
  if(!ANIM||!k||ph._h)return null;
  var h={box:null,a:null,img:ph.querySelector('img')};ph._h=h;
  withLib(function(){
    if(!ANIM||ph._h!==h||!ph.isConnected)return;
    var box=el('div','lt');h.box=box;ph.appendChild(box);
    try{
      h.a=window.lottie.loadAnimation({container:box,renderer:'svg',loop:true,autoplay:true,path:lottieUrl(k),
        rendererSettings:{preserveAspectRatio:'xMidYMid slice',progressiveLoad:true}});
      h.a.addEventListener('DOMLoaded',function(){box.classList.add('ok');if(h.img)h.img.classList.add('bgb');ph.style.animation='none'});
      h.a.addEventListener('data_failed',function(){stopAnim(h);ph._h=null});
    }catch(e){stopAnim(h);ph._h=null;return}
    if(limit){ACTIVE.push(h);while(ACTIVE.length>MAXACT){var o=ACTIVE[0];ACTIVE.shift();if(o.ph)o.ph._h=null;stopAnim(o)}}
  });
  h.ph=ph;return h;
}
var IO=('IntersectionObserver' in window)?new IntersectionObserver(function(es){
  es.forEach(function(e){var ph=e.target;
    clearTimeout(ph._t);
    if(e.isIntersecting){if(ANIM&&!ph._h)ph._t=setTimeout(function(){if(ANIM&&!ph._h)startAnim(ph,ph.getAttribute('data-k'),true)},300)}
    else if(ph._h){var h=ph._h;ph._h=null;stopAnim(h)}});
},{rootMargin:'0px',threshold:0.45}):null;
function watch(ph,k){if(IO&&k){ph.setAttribute('data-k',k);IO.observe(ph)}}
function syncBtn(){var b=$('animBtn');b.classList[ANIM?'remove':'add']('off');b.textContent=ANIM?'✨':'✨ выкл'}
function setAnim(on){
  ANIM=on;try{localStorage.setItem('anim',on?'1':'0')}catch(e){}
  if(!on){ACTIVE.slice().forEach(function(h){if(h.ph)h.ph._h=null;stopAnim(h)});document.querySelectorAll('.ph').forEach(function(p){if(p._h){stopAnim(p._h);p._h=null}})}
  else{document.querySelectorAll('.ph[data-k]').forEach(function(p){IO&&IO.unobserve(p);IO&&IO.observe(p)})}
  syncBtn();
}
$('animBtn').onclick=function(){setAnim(!ANIM)};syncBtn();
function card(it){
  var c=el('div','card'),ph=el('div','ph','🎁');
  if(it.k){var im=document.createElement('img');im.loading='lazy';im.alt='';im.onload=function(){im.className='ok';ph.style.animation='none';ph.style.background='var(--ph)'};im.onerror=function(){im.remove();ph.style.animation='none'};im.src=imgUrl(it.k);ph.appendChild(im)}
  c.appendChild(ph);var ci=el('div','ci');
  ci.appendChild(el('div','nm',it.n));
  ci.appendChild(el('div','sub',[it.m,it.b].filter(Boolean).join(' · ')||it.c));
  ci.appendChild(el('div','pr','от '+fmt(price(it,it.d1))+' ₽'));
  c.appendChild(ci);watch(ph,it.k);c.style.animationDelay=((SHOWN%PAGE)%10*35)+'ms';c.onclick=function(){openSheet(it)};return c;
}
function renderMore(){
  var g=$('grid'),end=Math.min(VIEW.length,SHOWN+PAGE);
  for(var i=SHOWN;i<end;i++)g.appendChild(card(VIEW[i]));
  SHOWN=end;
}
function apply(){
  var q=$('q').value.trim().toLowerCase(),s=$('sort').value,pmin=num($('pmin').value),pmax=num($('pmax').value);
  VIEW=ITEMS.filter(function(it){
    if(COLL&&it.c!==COLL)return false;
    var pp=price(it,it.d1);if(pmin&&pp<pmin)return false;if(pmax&&pp>pmax)return false;
    if(q){var h=(it.n+' '+it.c+' '+(it.m||'')+' '+(it.b||'')+' '+(it.s||'')).toLowerCase();
      var ws=q.split(/\s+/);for(var i=0;i<ws.length;i++){if(h.indexOf(ws[i])<0)return false}}
    return true;
  });
  VIEW.sort(function(a,b){return s==='pd'?price(b,b.d1)-price(a,a.d1):s==='n'?a.n.localeCompare(b.n,'ru',{numeric:true}):price(a,a.d1)-price(b,b.d1)});
  $('grid').textContent='';SHOWN=0;renderMore();
  $('state').textContent=VIEW.length?'':'Ничего не найдено 😕';$('state').style.display=VIEW.length?'none':'block';
}
var COVER={},CNT={};
function prep(){CNT={};COVER={};ITEMS.forEach(function(it){CNT[it.c]=(CNT[it.c]||0)+1;var c=COVER[it.c];if(!c||(!c.k&&it.k))COVER[it.c]=it})}
function avatar(n){var a=el('span','av','🎁'),it=COVER[n];
  if(it&&it.k){var im=document.createElement('img');im.alt='';im.loading='lazy';im.onerror=function(){im.remove()};im.src=imgUrl(it.k);a.textContent='';a.appendChild(im)}return a}
function names(){return Object.keys(CNT).sort(function(a,b){return CNT[b]-CNT[a]||a.localeCompare(b,'ru')})}
function chips(){
  var box=$('chips');box.textContent='';
  function mk(label,val,av){var c=el('span','chip'+(av?'':' txt')+(COLL===val?' on':''));if(av)c.appendChild(av);c.appendChild(document.createTextNode(label));c.onclick=function(){COLL=val;chips();apply()};box.appendChild(c)}
  mk('Все ('+ITEMS.length+')','');
  var g=el('span','chip txt','🗂 Коллекции ('+names().length+')');g.onclick=collSheet;box.appendChild(g);
  names().forEach(function(n){mk(n+' ('+CNT[n]+')',n,avatar(n))});
  var on=box.querySelector('.on');if(on&&on.scrollIntoView)try{on.scrollIntoView({inline:'center',block:'nearest'})}catch(e){}
}
var SHEETH=null;
function showSheet(on){if(!on&&SHEETH){stopAnim(SHEETH);SHEETH=null}
  $('bg').classList[on?'add':'remove']('open');$('sheet').classList[on?'add':'remove']('open');
  try{if(TG&&TG.BackButton){on?TG.BackButton.show():TG.BackButton.hide()}}catch(e){}}
$('bg').onclick=function(){showSheet(false)};
function collSheet(){
  var s=$('sheet');s.textContent='';s.appendChild(el('h1',null,'Коллекции в наличии'));
  var inp=document.createElement('input');inp.type='search';inp.className='cq';inp.placeholder='Поиск коллекции…';inp.autocomplete='off';s.appendChild(inp);
  var g=el('div','cgrid');s.appendChild(g);var empty=el('div','state','Такой коллекции нет 😕');empty.style.display='none';empty.style.padding='24px 0';s.appendChild(empty);
  function close(v){COLL=v;chips();apply();showSheet(false);window.scrollTo(0,0)}
  function cover(c,it){var p=el('div','ph','🎁');
    if(it&&it.k){var im=document.createElement('img');im.alt='';im.loading='lazy';im.onload=function(){im.className='ok';p.style.animation='none';p.style.background='var(--ph)'};im.onerror=function(){im.remove();p.style.animation='none'};im.src=imgUrl(it.k);p.appendChild(im)}
    watch(p,it&&it.k);c.appendChild(p)}
  function draw(){
    var q=inp.value.trim().toLowerCase();g.textContent='';var n0=0;
    if(!q){var all=el('div','cc'+(COLL===''?' on':''));all.appendChild(el('div','ph','🎁'));all.appendChild(el('div','nm','Все подарки'));all.appendChild(el('div','sub',String(ITEMS.length)));all.onclick=function(){close('')};g.appendChild(all)}
    names().forEach(function(n,i){
      if(q&&n.toLowerCase().indexOf(q)<0)return;n0++;
      var it=COVER[n],c=el('div','cc'+(COLL===n?' on':''));cover(c,it);
      c.appendChild(el('div','nm',n));c.appendChild(el('div','sub',CNT[n]+' шт.'));c.style.animationDelay=Math.min(i,15)*30+'ms';
      c.onclick=function(){close(n)};g.appendChild(c)});
    empty.style.display=(q&&!n0)?'block':'none';
  }
  inp.addEventListener('input',function(){clearTimeout(window._c);window._c=setTimeout(draw,150)});
  draw();s.scrollTop=0;showSheet(true);
}
function openSheet(it){
  var s=$('sheet');s.textContent='';
  var big=el('div','big'),ph=el('div','ph','🎁');
  if(it.k){var im=document.createElement('img');im.alt='';im.onload=function(){im.className='ok';ph.style.animation='none';ph.style.background='var(--ph)'};im.onerror=function(){im.remove();ph.style.animation='none'};im.src=imgUrl(it.k);ph.appendChild(im)}
  big.appendChild(ph);s.appendChild(big);if(SHEETH){stopAnim(SHEETH);SHEETH=null}
  SHEETH=startAnim(ph,it.k,false);s.appendChild(el('h1',null,it.n));
  function kv(a,b){if(!b)return;var r=el('div','kv');r.appendChild(el('span',null,a));r.appendChild(el('span',null,b));s.appendChild(r)}
  kv('Коллекция',it.c);kv('Модель',it.m);kv('Фон',it.b);kv('Символ',it.s);
  kv('Цена за '+it.d1+' дн.',fmt(price(it,it.d1))+' ₽');
  if(it.d2>it.d1)kv('Срок аренды',it.d1+'–'+it.d2+' дн.');else kv('Срок аренды',it.d1+' дн.');
  var b=el('button','btn','🎁 Арендовать в боте');
  b.onclick=function(){if(BOT)openTg('https://t.me/'+BOT+'?start=g_'+it.a);else alert('Откройте бота и выберите подарок в каталоге')};
  s.appendChild(b);
  if(it.k){var v=el('button','btn sec','👁 Открыть в Telegram');v.onclick=function(){openTg(tgUrl(it.k))};s.appendChild(v)}
  s.appendChild(el('div','note','Цена и наличие окончательно проверяются в боте'));
  showSheet(true);
}
function ago(ts){var m=Math.max(0,Math.round((Date.now()/1000-ts)/60));return m<2?'только что':m<60?m+' мин назад':Math.round(m/60)+' ч назад'}
function show(d,fresh){
  DATA=d;ITEMS=d.items||[];BOT=d.bot||'';
  $('meta').textContent=(d.ton?'1 TON ≈ '+fmt(d.ton)+' ₽ · ':'')+(fresh?'обновлено ':'сохранено ')+ago(d.ts);
  if(!ITEMS.length){$('state').style.display='block';$('state').textContent='Каталог пока пуст';return}
  prep();chips();apply();
}
function load(){
  var cached=null;
  try{var raw=localStorage.getItem('catv1');if(raw){cached=JSON.parse(raw);if(cached&&cached.items&&cached.items.length)show(cached,false);else cached=null}}catch(e){cached=null}
  fetch('catalog.json?ts='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(d){
    try{localStorage.setItem('catv1',JSON.stringify(d))}catch(e){}
    var keep=window.scrollY;show(d,true);try{window.scrollTo(0,keep)}catch(e){}
  }).catch(function(e){
    if(cached)return;
